name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Guarda anti-loop: o commit de bump não gera outro APK. O push do bump sai
    # SEM [skip ci] na mensagem de propósito — o Vercel respeita [skip ci] e,
    # além de pular o bump, cancelava o build do merge ainda na fila (site web
    # ficou 4 dias preso na v4.24 por isso, 09→12/08).
    # Aspas duplas obrigatórias: sem elas o ": " dentro de 'chore: bump version'
    # quebra o YAML (escalar plano) e o workflow INTEIRO falha com 0s/sem jobs.
    if: "github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Get current version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

      - name: Inject version into build.gradle
        run: |
          V="${{ steps.version.outputs.current }}"
          # versionCode DESACOPLADO do nome: cresce a cada build (nº do run), então o
          # nome da versão pode ser renumerado à vontade (3.102 → 3.2) sem o Android
          # tratar como downgrade e recusar a instalação por cima.
          # Base 50000 > qualquer code já publicado pela fórmula antiga (máx. 40200).
          CODE=$((50000 + ${{ github.run_number }}))
          sed -i "s/versionCode [0-9]\+/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          echo "versionCode=$CODE versionName=$V"
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/watchmov-release.keystore

      # Firebase (push): o repo é público, então o google-services.json vem de secret.
      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build signed APK
        run: cd android && ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          mv "$APK" "android/app/build/outputs/apk/release/WatchMov-v${{ steps.version.outputs.current }}.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: WatchMov-v${{ steps.version.outputs.current }}
          path: android/app/build/outputs/apk/release/WatchMov-v${{ steps.version.outputs.current }}.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.current }}
          name: WatchMov v${{ steps.version.outputs.current }}
          body: |
            ## WatchMov v${{ steps.version.outputs.current }}
            APK gerado automaticamente (assinado).
            **Download:** Baixe o `WatchMov-v${{ steps.version.outputs.current }}.apk` abaixo.
          files: android/app/build/outputs/apk/release/WatchMov-v${{ steps.version.outputs.current }}.apk
          generate_release_notes: true
          make_latest: true

      - name: Bump version for next build
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Retry com reset --hard origin/main para evitar race entre runs paralelos.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            CURRENT=$(node -p "require('./package.json').version")
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            # Minor vai só até 99: passou disso, sobe o major e zera.
            # 3.2 → 3.3 → … → 3.99 → 4.0. Nunca mais um 3.101.
            # 10# força base decimal (senão "08"/"09" viram octal inválido).
            NEW_MINOR=$((10#$MINOR + 1))
            NEW_MAJOR=$((10#$MAJOR))
            if [ "$NEW_MINOR" -gt 99 ]; then NEW_MAJOR=$((NEW_MAJOR + 1)); NEW_MINOR=0; fi
            NEXT="$NEW_MAJOR.$NEW_MINOR"
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = '$NEXT';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            git add package.json
            if git diff --staged --quiet; then exit 0; fi
            # Sem [skip ci]: o job acima já se protege do loop e o Vercel
            # precisa buildar este commit (senão o site fica pra trás).
            git commit -m "chore: bump version to v$NEXT"
            if git push origin main; then
              echo "Pushed v$NEXT on attempt $i"
              exit 0
            fi
            echo "Push rejeitado tentativa $i, refazendo..."
            sleep $((i * 2))
          done
          echo "::error::Falha bump apos 5 tentativas"
          exit 1
