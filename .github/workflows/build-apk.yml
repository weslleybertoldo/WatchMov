name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Guarda anti-loop: o commit de bump não gera outro APK. O push do bump sai
    # SEM [skip ci] na mensagem de propósito — o Vercel respeita [skip ci] e,
    # além de pular o bump, cancelava o build do merge ainda na fila (site web
    # ficou 4 dias preso na v4.24 por isso, 09→12/08).
    # Aspas duplas obrigatórias: sem elas o ": " dentro de 'chore: bump version'
    # quebra o YAML (escalar plano) e o workflow INTEIRO falha com 0s/sem jobs.
    if: "github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    outputs:
      # Versão do APK = a do app do Windows (job windows, mesma release).
      version: ${{ steps.version.outputs.current }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # O padrão do action instala o pacote legado 'tools', que saiu do repositório do SDK
          # (run 274, 14/09/2026: "Failed to find package 'tools'" → sdkmanager exit 1). Só o
          # platform-tools basta: o Gradle baixa platforms/build-tools que faltarem.
          packages: platform-tools

      - name: Get current version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

      - name: Inject version into build.gradle
        run: |
          V="${{ steps.version.outputs.current }}"
          # versionCode DESACOPLADO do nome: cresce a cada build (nº do run), então o
          # nome da versão pode ser renumerado à vontade (3.102 → 3.2) sem o Android
          # tratar como downgrade e recusar a instalação por cima.
          # Base 50000 > qualquer code já publicado pela fórmula antiga (máx. 40200).
          # 04/11/2026: base 50010 — o APK de teste das Fontes 5/6 ficou na Fire TV com
          # 50345 e o run #342 daria 50342 (o Android recusa instalar versão menor por cima).
          CODE=$((50010 + ${{ github.run_number }}))
          sed -i "s/versionCode [0-9]\+/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          echo "versionCode=$CODE versionName=$V"
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/watchmov-release.keystore

      # Firebase (push): o repo é público, então o google-services.json vem de secret.
      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build signed APK
        run: cd android && ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          mv "$APK" "android/app/build/outputs/apk/release/WatchMov-v${{ steps.version.outputs.current }}.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: WatchMov-v${{ steps.version.outputs.current }}
          path: android/app/build/outputs/apk/release/WatchMov-v${{ steps.version.outputs.current }}.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.current }}
          name: WatchMov v${{ steps.version.outputs.current }}
          body: |
            ## WatchMov v${{ steps.version.outputs.current }}
            APK gerado automaticamente (assinado).
            **Download:** Baixe o `WatchMov-v${{ steps.version.outputs.current }}.apk` abaixo.
          files: android/app/build/outputs/apk/release/WatchMov-v${{ steps.version.outputs.current }}.apk
          generate_release_notes: true
          make_latest: true

      - name: Bump version for next build
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Retry com reset --hard origin/main para evitar race entre runs paralelos.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            CURRENT=$(node -p "require('./package.json').version")
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            # Minor vai só até 99: passou disso, sobe o major e zera.
            # 3.2 → 3.3 → … → 3.99 → 4.0. Nunca mais um 3.101.
            # 10# força base decimal (senão "08"/"09" viram octal inválido).
            NEW_MINOR=$((10#$MINOR + 1))
            NEW_MAJOR=$((10#$MAJOR))
            if [ "$NEW_MINOR" -gt 99 ]; then NEW_MAJOR=$((NEW_MAJOR + 1)); NEW_MINOR=0; fi
            NEXT="$NEW_MAJOR.$NEW_MINOR"
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = '$NEXT';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            git add package.json
            if git diff --staged --quiet; then exit 0; fi
            # Sem [skip ci]: o job acima já se protege do loop e o Vercel
            # precisa buildar este commit (senão o site fica pra trás).
            git commit -m "chore: bump version to v$NEXT"
            if git push origin main; then
              echo "Pushed v$NEXT on attempt $i"
              exit 0
            fi
            echo "Push rejeitado tentativa $i, refazendo..."
            sleep $((i * 2))
          done
          echo "::error::Falha bump apos 5 tentativas"
          exit 1

  windows:
    # App do Windows (desktop/): o instalador e o latest.yml vão na MESMA release do APK, com a mesma versão.
    # O atualizador do celular só pega .apk (UpdateChecker.tsx) e o do Windows só o latest.yml + .exe.
    # Só publica se o app instalado passar no smoke contra o site de produção já com o código deste commit.
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Unit tests (network rules)
        run: npm run testar

      - name: Build Windows installer
        run: npm run windows

      - name: Wait for the Vercel production deploy of this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ($i = 0; $i -lt 60; $i++) {
            $dep = gh api "repos/${{ github.repository }}/deployments?sha=${{ github.sha }}&environment=Production" --jq '.[0].id'
            if ($dep) {
              $estado = gh api "repos/${{ github.repository }}/deployments/$dep/statuses" --jq '.[0].state'
              Write-Output "deploy $dep : $estado"
              if ($estado -eq 'success') { exit 0 }
              if ($estado -eq 'failure' -or $estado -eq 'error') { throw "deploy da Vercel falhou ($estado)" }
            }
            Start-Sleep -Seconds 10
          }
          throw 'o deploy da Vercel não ficou pronto em 10 min'

      - name: Install and smoke test (production site)
        shell: pwsh
        env:
          WM_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          WM_SUPABASE_ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          WM_SMOKE_EMAIL: smoke-claude@teste.com
          WM_SMOKE_SENHA: ${{ secrets.WM_SMOKE_SENHA }}
        run: ./ci-windows.ps1

      - name: Upload smoke prints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WatchMov-Windows-v${{ needs.build.outputs.version }}-prints
          path: desktop/smoke-prints/
          retention-days: 30

      - name: Add the Windows installer to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          files: |
            desktop/release/WatchMov-Setup-*.exe
            desktop/release/latest.yml
          make_latest: true

      - name: Update test (the previous version updates itself to this one)
        # O .exe da release anterior (o que está no PC dele) acha esta versão, baixa e se instala sozinho.
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./ci-atualizacao.ps1 -Tag "v${{ needs.build.outputs.version }}" -Versao (Get-Content package.json -Raw | ConvertFrom-Json).version
