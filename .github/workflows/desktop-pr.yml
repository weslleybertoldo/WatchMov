name: App do Windows (PR)

# Staging do app do Windows: em cada PR que mexe no app (ou no site que ele abre), gera o instalador numa máquina
# Windows, instala, abre o app no site de staging e confere login, Início e player (prints no artefato).
# O staging (watchmov-staging.vercel.app) tem que estar com o código da PR (preview da Vercel + alias) antes.
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/**'
      - '.github/workflows/desktop-pr.yml'
  workflow_dispatch:
    inputs:
      site:
        description: 'Site que o app abre'
        default: 'https://watchmov-staging.vercel.app/'
      atualizacao:
        description: 'Só a prova da atualização: o .exe da release anterior se atualiza sozinho pra Latest'
        type: boolean
        default: false

jobs:
  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.atualizacao }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Unit tests (network rules)
        run: npm run testar

      - name: Build Windows installer
        run: npm run windows

      - name: Install and smoke test (staging site)
        shell: pwsh
        env:
          WM_SITE: ${{ inputs.site || 'https://watchmov-staging.vercel.app/' }}
          WM_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          WM_SUPABASE_ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          WM_SMOKE_EMAIL: smoke-claude@teste.com
          WM_SMOKE_SENHA: ${{ secrets.WM_SMOKE_SENHA }}
        run: ./ci-windows.ps1

      - name: Upload prints and installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WatchMov-Windows-PR-prints
          path: |
            desktop/smoke-prints/
            desktop/release/WatchMov-Setup-*.exe
          retention-days: 7

  atualizacao:
    # Prova sob demanda (gh workflow run desktop-pr.yml -f atualizacao=true): instala o .exe da release anterior e
    # confere que ele acha a Latest, baixa e se instala sozinho — o mesmo caminho do PC dele, sem gastar uma release.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.atualizacao }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Update test (previous release updates itself to Latest)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = gh release view --repo ${{ github.repository }} --json tagName --jq .tagName
          $versao = $tag.TrimStart('v')
          if (($versao -split '\.').Count -eq 2) { $versao = "$versao.0" }   # = versao.cjs: 5.21 vira 5.21.0
          Write-Output "Latest: $tag (app $versao)"
          ./ci-atualizacao.ps1 -Tag $tag -Versao $versao
