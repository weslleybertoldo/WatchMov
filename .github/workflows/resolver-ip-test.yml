name: Resolver IP Test (datacenter)

# Teste descartável: roda o resolvedor Playwright a partir do runner (IP de
# datacenter Azure) pra ver se os providers respondem fora do IP residencial.
on:
  workflow_dispatch:
  push:
    branches: [feat/cast-smartplay]
    paths: ['resolver/**', '.github/workflows/resolver-ip-test.yml']

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: IP público do runner
        run: curl -s https://api.ipify.org; echo
      - name: Install resolver deps
        working-directory: resolver
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Test embedplayapi (movie 969681)
        working-directory: resolver
        run: node src/test-local.js embedplayapi movie 969681 || true
      - name: Test fembed (movie 969681)
        working-directory: resolver
        run: node src/test-local.js fembed movie 969681 || true
      - name: Test superflix (movie tt22084616)
        working-directory: resolver
        run: node src/test-local.js superflix movie 969681 tt22084616 || true
      - name: Test myembed (movie tt22084616)
        working-directory: resolver
        run: node src/test-local.js myembed movie 969681 tt22084616 || true
